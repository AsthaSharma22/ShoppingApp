

{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}My Shopping Store{% endblock %}
    </title>

    <link rel="stylesheet" href="{% static 'shop/styles.css' %}">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">

        <h2>My Shopping Store</h2>

        <div class="nav-links">

            <a href="{% url 'shop:product_list' %}">
                Home
            </a>

            <a href="{% url 'shop:cart_detail' %}">
                🛒 Cart ({{ cart_count }})
            </a>

        </div>

    </nav>

    <!-- Main Content -->
    <main class="container">

        <!-- Display Messages -->
        {% if messages %}

            <div class="messages">

                {% for message in messages %}

                    <p class="message">
                        {{ message }}
                    </p>

                {% endfor %}

            </div>

        {% endif %}

        <!-- Page Specific Content -->
        {% block content %}
        {% endblock %}

    </main>

</body>

</html>
